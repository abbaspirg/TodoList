name: Build Android APK

# Builds a debug APK on GitHub's runners (which carry Flutter + Android SDK
# preinstalled) since this repo's dev sandbox network policy blocks the
# Android SDK download host. Runs on every push to a claude/* branch, and
# can be triggered manually from the Actions tab.
on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Backfill the android/ platform folder
        # This repo ships only lib/ + pubspec.yaml — `flutter create` here
        # only adds the missing android/ scaffold, it does not touch
        # existing Dart sources.
        run: flutter create --platforms=android --org com.madrasafest .

      - run: flutter pub get

      - name: Generate freezed/json_serializable code
        # --verbose so a hang leaves a log trail instead of a silent
        # multi-minute black box; explicit timeout so a real hang fails
        # fast with the job's logs still downloadable (in-progress job
        # logs return 404 until the job ends).
        timeout-minutes: 10
        run: dart run build_runner build --delete-conflicting-outputs --verbose

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: madrasa-fest-manager-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
