name: Ludo Android build

# Builds the Ludo Circle debug APK.
#
# Unlike mobile/, the Android project here is NOT committed — it is
# generated by `npx cap add android` on each run and then patched with the
# permissions voice chat needs. That keeps ~100 generated files out of the
# repository at the cost of a slightly longer build.

on:
  push:
    branches: ["claude/**"]
    paths:
      - "ludo/**"
      - ".github/workflows/ludo-android.yml"
  pull_request:
    paths:
      - "ludo/**"
  # Ship a build with a Firebase project (and optionally a voice relay)
  # already inside it, so players install and play with no setup screen.
  # A Firebase web config is not a secret, so it is fine as a plain input.
  workflow_dispatch:
    inputs:
      firebase_config:
        description: "Firebase web config as JSON (blank = generic build with a setup screen)"
        required: false
        default: ""
      turn_urls:
        description: "TURN relay URL for voice, e.g. turn:relay.example.com:3478 (optional)"
        required: false
        default: ""
      turn_username:
        description: "TURN username (optional)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ludo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # The rules engine is pure and dependency-free, so this runs before
      # anything is installed and fails the build fast if a rule regressed.
      - name: Test the rules engine
        run: node test/game.test.mjs

      # Fails the build outright on a malformed config rather than shipping
      # an APK that silently falls back to the setup screen.
      - name: Bake in the Firebase project
        if: inputs.firebase_config != ''
        env:
          FIREBASE_CONFIG: ${{ inputs.firebase_config }}
          TURN_URLS: ${{ inputs.turn_urls }}
          TURN_USERNAME: ${{ inputs.turn_username }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
        run: node scripts/write-build-config.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate the Android project
        run: npx cap add android

      - name: Add the microphone permissions
        run: node scripts/patch-android-manifest.mjs

      - name: Build the plugin bundle and sync Capacitor
        run: npm run sync

      - name: Build debug APK
        working-directory: ludo/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ludo-circle-debug-apk
          path: ludo/android/app/build/outputs/apk/debug/app-debug.apk
