name: Android build

on:
  push:
    branches: [main, master]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "mobile/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: todo-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Check for release signing secret
        id: check_secret
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "present=${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: steps.check_secret.outputs.present == 'true'
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/release.keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Build signed release AAB
        if: steps.check_secret.outputs.present == 'true'
        working-directory: mobile/android
        run: ./gradlew bundleRelease --no-daemon
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload release AAB
        if: steps.check_secret.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: todo-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
