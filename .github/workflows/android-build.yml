name: Android build

on:
  push:
    branches: ["claude/**"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "mobile/**"
  # Per-institution build: paste a customer's Firebase web config and their
  # name, and the resulting APK connects to their project on first launch
  # with no setup step for anyone. Leave both blank for the generic build,
  # where an admin pastes the config into the app's setup screen instead.
  # See README "Multi-institution setup". A Firebase web config is not a
  # secret (it ships in the source of every Firebase web app), so it's fine
  # as a plain workflow input rather than a repository secret.
  workflow_dispatch:
    inputs:
      institution_name:
        description: "Institution name shown in the app (blank = generic build)"
        required: false
        default: ""
      firebase_config:
        description: "That institution's Firebase web config, as JSON (blank = generic build)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # Fails the build outright on a malformed config, rather than
      # shipping an APK that silently falls back to the setup screen.
      - name: Bake in institution config
        if: inputs.firebase_config != ''
        env:
          INSTITUTION_NAME: ${{ inputs.institution_name }}
          FIREBASE_CONFIG: ${{ inputs.firebase_config }}
        run: node scripts/write-build-config.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build native-plugin bundle and sync Capacitor
        run: npm run sync

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: madrasa-fest-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
