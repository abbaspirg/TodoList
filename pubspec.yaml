name: madrasa_fest_manager
description: Madrasa Meelad Fest Management App — students, groups, categories, items, live judging, results and poster generation.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Firebase backend
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  cloud_functions: ^5.0.4
  firebase_messaging: ^15.0.4

  # Poster generation (widget -> image) & sharing
  screenshot: ^3.0.0
  share_plus: ^9.0.0
  path_provider: ^2.1.3

  # Misc utilities
  image_picker: ^1.1.2
  intl: ^0.19.0
  characters: ^1.3.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  generate: true
